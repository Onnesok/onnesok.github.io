<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>portfolio</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "2188228065";
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="preloader">
    <div class="preloader-spinner"></div>
    <div class="preloader-text">Loading Portfolio...</div>
  </div>
  <style>
    #preloader {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #181c24 60%, #232946 100%);
      z-index: 9999;
      transition: opacity 0.5s;
    }
    .preloader-spinner {
      width: 54px;
      height: 54px;
      border: 6px solid #3a86ff;
      border-top: 6px solid #f72585;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 18px;
      box-shadow: 0 0 16px #3a86ff44;
    }
    .preloader-text {
      color: #fff;
      font-family: 'Inter', Arial, sans-serif;
      font-size: 1.2rem;
      letter-spacing: 0.04em;
      opacity: 0.85;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @media (max-width: 600px) {
      .preloader-text { font-size: 1rem; }
      .preloader-spinner { width: 38px; height: 38px; border-width: 4px; }
    }
  </style>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
            // Fade out and remove preloader
            var preloader = document.getElementById('preloader');
            if (preloader) {
              preloader.style.opacity = '0';
              setTimeout(function() { preloader.remove(); }, 600);
            }
          });
        }
      });
    });
  </script>
</body>
</html>
