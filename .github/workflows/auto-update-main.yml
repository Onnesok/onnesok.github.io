name: Auto Update Main with Build Files

on:
  push:
    branches:
      - flutter

jobs:
  build-and-update-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout flutter branch
        uses: actions/checkout@v3
        with:
          ref: flutter
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web

      - name: Commit build files to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          cp -r build/web/* .
          git add .
          git commit -m "Auto-update build files from flutter branch" || echo "No changes to commit"
          git push origin main 